name: stale-links

# chayprabs/scoop-localtools was deleted: the Scoop bucket now lives in bucket/ of chayprabs/homebrew-localtools.
# Fails if a release or an edit brings the old URL back.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: no links to the deleted Scoop bucket repo
        run: |
          if git grep -n "chayprabs/scoop-localtools" -- . ':!.github/workflows/stale-links.yml'; then
            echo "::error::chayprabs/scoop-localtools no longer exists. Use https://github.com/chayprabs/homebrew-localtools instead."
            exit 1
          fi
          echo "no stale Scoop bucket links"
